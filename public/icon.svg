<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" fill="url(#iconGrad)"/>

  <!-- Sparkle effect -->
  <g opacity="0.95">
    <!-- Main sparkle star -->
    <path d="M 256 80 L 266 140 L 326 130 L 280 180 L 330 220 L 270 230 L 280 290 L 256 230 L 232 290 L 242 230 L 182 220 L 232 180 L 186 130 L 246 140 Z" fill="white"/>

    <!-- Smaller sparkles -->
    <circle cx="400" cy="150" r="12" fill="white" opacity="0.8"/>
    <circle cx="120" cy="180" r="8" fill="white" opacity="0.7"/>
    <circle cx="380" cy="380" r="10" fill="white" opacity="0.8"/>
    <circle cx="140" cy="400" r="8" fill="white" opacity="0.7"/>
  </g>

  <!-- Face outline -->
  <ellipse cx="256" cy="280" rx="140" ry="160" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="220" cy="260" r="12" fill="white"/>
  <circle cx="292" cy="260" r="12" fill="white"/>

  <!-- Smile -->
  <path d="M 190 320 Q 256 360 322 320" stroke="white" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
